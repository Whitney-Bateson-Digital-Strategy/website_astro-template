site:
  name: '[CLIENT NAME]'               # e.g. Sarah Johnson, RD
  site: 'https://example.com' # ← Replace with client domain, e.g. https://sarahjohnson.com — required for sitemap
  base: '/'
  trailingSlash: false

  # googleSiteVerificationId: 'ADD-CODE-FROM-GOOGLE-SEARCH-CONSOLE'

# Default SEO metadata
metadata:
  title:
    default: '[CLIENT NAME] — [CREDENTIAL]'           # e.g. Sarah Johnson, RD — Registered Dietitian
    template: '%s — [CLIENT NAME]'                    # e.g. %s — Sarah Johnson, RD
  description: '[1-2 sentence site description with location and specialty]'
  robots:
    index: true
    follow: true
  openGraph:
    site_name: '[CLIENT NAME]'
    images:
      - url: '~/assets/images/og-default.png' # Create a 1200x628px branded image per client
        width: 1200
        height: 628
    type: website
  twitter:
    handle: ''   # Add @handle only if client has Twitter/X; card tags still render for Slack/Discord/iMessage previews
    site: ''
    cardType: summary_large_image

i18n:
  language: en
  textDirection: ltr

apps:
  blog:
    isEnabled: true
    postsPerPage: 6

    post:
      isEnabled: true
      permalink: '/%slug%' # Variables: %slug%, %year%, %month%, %day%, %hour%, %minute%, %second%, %category%
      robots:
        index: true

    list:
      isEnabled: true
      pathname: 'blog' # Blog main path, you can change this to "articles" (/articles)
      robots:
        index: true

    category:
      isEnabled: true
      pathname: 'category' # Category main path /category/some-category, you can change this to "group" (/group/some-category)
      robots:
        index: true

    tag:
      isEnabled: true
      pathname: 'tag' # Tag main path /tag/some-tag, you can change this to "topics" (/topics/some-category)
      robots:
        index: false

    isRelatedPostsEnabled: true
    relatedPostsCount: 4

analytics:
  vendors:
    googleAnalytics:
      id: null # or "G-XXXXXXXXXX"

ui:
  theme: 'light:only' # Values: "system" | "light" | "dark" | "light:only" | "dark:only"
